services:
  xplainable-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: xplainable-mcp-server:latest
    container_name: xplainable-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      # Override any environment variables here
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
