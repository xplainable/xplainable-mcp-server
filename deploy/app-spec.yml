# Digital Ocean App Platform specification
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
name: xplainable-mcp-server

services:
  - name: mcp-server
    dockerfile_path: Dockerfile
    github:
      repo: xplainable/xplainable-mcp-server
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
    envs:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: XPLAINABLE_API_KEY
        type: SECRET
      - key: XPLAINABLE_HOSTNAME
        value: https://platform.xplainable.io
      - key: ENABLE_WRITE_TOOLS
        value: "false"
      # Auth0 (Phase 2)
      # - key: AUTH0_DOMAIN
      #   value: dev-k-xn6t1r.us.auth0.com
      # - key: AUTH0_CLIENT_ID
      #   type: SECRET
      # - key: AUTH0_CLIENT_SECRET
      #   type: SECRET
      # - key: MCP_SERVER_URL
      #   value: https://mcp.xplainable.io

domains:
  - domain: mcp.xplainable.io
    type: PRIMARY
